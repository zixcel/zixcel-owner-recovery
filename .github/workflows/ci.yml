name: Product workspace CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.97 --profile minimal --component rustfmt --component clippy
      - name: Check every maintained package
        run: |
          cargo +1.97 fmt --all -- --check
          cargo +1.97 clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo +1.97 test --locked --workspace --all-targets --all-features
          cargo +1.97 test --locked --workspace --doc --all-features
          cargo +1.97 build --locked --workspace --bins
      - name: Audit exact dependency lock
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --no-default-features --root "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/cargo-audit" audit --deny warnings
